syntax = "proto3";
package ekos;

message Empty {}

message TrainRequest {
  string train = 1;
}

message TrainResponse {
  string train = 1;
}

message StartResponse {
  string response = 1;
}

enum FrameType {
  LIGHT = 0;
  DARK = 1;
  FLAT = 2;
  BIAS = 3;
}

message CaptureComplete {
  string train = 1;
  double exposure = 2;
  string filter = 3;
  int64 width = 4;
  int64 height = 5;
  FrameType type = 6;
  string filename = 7;
}

service Capture {
  rpc Start(TrainRequest) returns (StartResponse);
  rpc Abort(TrainRequest) returns (Empty);
  rpc Suspend(Empty) returns (Empty);
  rpc Pause(Empty) returns (Empty);
  rpc Stop(Empty) returns (Empty);
  rpc OpticalTrain(Empty) returns (TrainResponse);
  rpc CaptureCompleteSignal(Empty) returns (stream CaptureComplete);
  }
